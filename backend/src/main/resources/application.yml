server:
  port: 8080
  servlet:
    context-path: /lab-system

spring:
  application:
    name: lab-server
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lab_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: e9937tdz
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      validation-query: SELECT 1
      test-while-idle: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

lab:
  jwt:
    # 生产环境请替换为随机长密钥（不少于 32 字节）
    secret: lab-system-jwt-secret-key-please-change-in-production-2026
    expire-hours: 12
  upload:
    # 文件上传根目录（相对启动目录），可通过环境变量覆盖
    dir: ./uploads

logging:
  level:
    com.lab: info
